t-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Ya: klik On Site -&gt; travel_arrived_at,</text><text x="1300" y="1209" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">SLA Travel berhenti</text><rect x="960" y="1400" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M978,1400 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="960" y="1470" width="10" height="74" rx="5" fill="#4a6fb5"/><text x="1300" y="1431" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">IN PROGRESS</text><text x="1300" y="1512" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">Start Progress -&gt; SLA Resolution MULAI</text><rect x="220" y="1125" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="560" y="1155" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Gangguan beres sebelum tiba: Form Close</text><text x="560" y="1191" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">dari Trip -&gt; perjalanan dibatalkan</text><text x="560" y="1227" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">otomatis</text><rect x="220" y="1400" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M238,1400 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="220" y="1470" width="10" height="74" rx="5" fill="#7a5aa6"/><text x="560" y="1431" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">PROGRESS DONE</text><text x="560" y="1512" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">Menunggu approval supervisor</text><rect x="90" y="1720" width="2420" height="188" rx="16" fill="#f6fafd" stroke="#9cbcd6" stroke-width="2"/><rect x="90" y="1720" width="10" height="188" rx="5" fill="#3b7ea1"/><text x="138" y="1762" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">startTravel(): evidence perjalanan WAJIB (keputusan 15 Okt 2026); SLA Travel mulai.</text><text x="138" y="1806" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">cancelTravel(): wajib alasan + tanggal plan berikutnya; jejak perjalanan dikosongkan, status kembali ke PLAN.</text><text x="138" y="1850" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Setelah On Site tiket tidak bisa dijadwal ulang dan teknisi tidak bisa diganti.</text></svg>