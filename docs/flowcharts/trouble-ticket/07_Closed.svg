<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1968" viewBox="0 0 2600 1968"><defs><marker id="ar" markerWidth="13" markerHeight="13" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#44708f"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f2b46" flood-opacity="0.13"/></filter></defs><rect width="2600" height="1968" fill="#ffffff"/><rect x="0" y="0" width="2600" height="190" fill="#f6fafd"/><rect x="0" y="188" width="2600" height="3" fill="#9cbcd6"/><rect x="90" y="56" width="10" height="70" rx="5" fill="#3b7ea1"/><text x="128" y="92" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1" fill="#0f2b46">7 · CLOSED</text><text x="128" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#5b7b95">Tiket final &amp; rekap SLA</text><polyline points="1300,438 1300,569" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="954,655 560,655 560,844" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="1646,655 2040,655 2040,844" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="1300,741 1300,1119" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="1300,1263 1300,1394" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="960" y="300" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="366" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Supervisor menyetujui penutupan</text><rect x="960" y="575" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M978,575 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="960" y="645" width="10" height="74" rx="5" fill="#2f7d4f"/><text x="1300" y="606" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">CLOSED</text><text x="1300" y="687" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">status final; closed_at &amp; closed_by diisi</text><rect x="220" y="850" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="560" y="898" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">resolution_seconds dikunci; tiga metrik</text><text x="560" y="934" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">SLA ditandai aman / warning / breach</text><rect x="1700" y="850" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="2040" y="916" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Notifikasi ke teknisi &amp; pembuat tiket</text><rect x="960" y="1125" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="1173" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Chat dan seluruh aksi workflow terkunci;</text><text x="1300" y="1209" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">timeline jadi arsip</text><rect x="960" y="1400" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="1448" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Tiket masuk rekap index &amp; laporan SLA</text><text x="1300" y="1484" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">(filter status, site, teknisi, periode)</text><rect x="90" y="1692" width="2420" height="232" rx="16" fill="#f6fafd" stroke="#9cbcd6" stroke-width="2"/><rect x="90" y="1692" width="10" height="232" rx="5" fill="#3b7ea1"/><text x="138" y="1734" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">FINAL_STATUSES = [&#x27;CLOSED&#x27;]: tidak ada transisi keluar, chat dikunci (canMessage false).</text><text x="138" y="1778" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">SLA Response = acknowledged_at - created_at; SLA Travel = travel_arrived_at - travel_started_at;</text><text x="138" y="1822" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">SLA Resolution = closed_at - progress_started_at, yaitu hanya rentang Progress sampai Closed.</text><text x="138" y="1866" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Lampiran tetap di disk secure, diakses lewat SecureFileController + FileAccess::allowsTroubleTicket().</text></svg>