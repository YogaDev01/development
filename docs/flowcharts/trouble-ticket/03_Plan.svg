2" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">visit_site = tanggal rencana kunjungan</text><polygon points="865,650 1300,540 1735,650 1300,760" fill="#eaf4e4" stroke="#7fae63" stroke-width="3" filter="url(#sh)"/><text x="1300" y="650" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#0f2b46">Jadwal / teknisi diubah?</text><rect x="1700" y="850" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="2040" y="898" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Create Plan ulang atau Change Teknisi</text><text x="2040" y="934" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">oleh leader team -&gt; tanggal baru</text><polygon points="865,1200 1300,1090 1735,1200 1300,1310" fill="#eaf4e4" stroke="#7fae63" stroke-width="3" filter="url(#sh)"/><text x="1300" y="1200" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#0f2b46">Tanggal visit tiba?</text><rect x="220" y="1400" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="560" y="1448" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Belum: tiket tetap menunggu di tahap</text><text x="560" y="1484" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Plan</text><rect x="960" y="1675" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M978,1675 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="960" y="1745" width="10" height="74" rx="5" fill="#b06a3b"/><text x="1300" y="1706" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">TRIP</text><text x="1300" y="1787" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">promoteDueTrips() menaikkan tiket otomatis</text><rect x="1700" y="1400" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="2040" y="1448" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Opsi: gangguan beres sebelum tanggal</text><text x="2040" y="1484" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">visit -&gt; Form Close dari Plan</text><rect x="1700" y="1675" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M1718,1675 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="1700" y="1745" width="10" height="74" rx="5" fill="#7a5aa6"/><text x="2040" y="1706" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">PROGRESS DONE</text><text x="2040" y="1770" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">Menunggu approval supervisor (tanpa melewati</text><text x="2040" y="1804" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">In Progress)</text><rect x="90" y="1995" width="2420" height="188" rx="16" fill="#f6fafd" stroke="#9cbcd6" stroke-width="2"/><rect x="90" y="1995" width="10" height="188" rx="5" fill="#3b7ea1"/><text x="138" y="2037" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Tidak ada approval plan (keputusan 12 Okt 2026): tiket naik sendiri ke Trip saat tanggalnya tiba.</text><text x="138" y="2081" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">promoteDueTrips() dipanggil saat daftar/detail dibuka — tidak ada scheduler di shared hosting.</text><text x="138" y="2125" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Change Teknisi (reassign) di tahap Plan boleh sekaligus mengganti tanggal visit.</text></svg>