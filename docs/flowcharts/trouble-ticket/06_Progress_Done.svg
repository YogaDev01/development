>berjalan</text><rect x="960" y="575" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="623" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Supervisor memeriksa RCA, keterangan</text><text x="1300" y="659" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">penyelesaian, dan evidence</text><polygon points="865,925 1300,815 1735,925 1300,1035" fill="#eaf4e4" stroke="#7fae63" stroke-width="3" filter="url(#sh)"/><text x="1300" y="925" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#0f2b46">Isian form close memadai?</text><rect x="1700" y="1125" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="2040" y="1173" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Tidak: Reject + alasan -&gt; approval =</text><text x="2040" y="1209" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">REJECTED, resolved_at dikosongkan</text><polygon points="1605,1475 2040,1365 2475,1475 2040,1585" fill="#eaf4e4" stroke="#7fae63" stroke-width="3" filter="url(#sh)"/><text x="2040" y="1475" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#0f2b46">Jalur tiket?</text><rect x="1700" y="1675" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M1718,1675 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="1700" y="1745" width="10" height="74" rx="5" fill="#2f8f83"/><text x="2040" y="1706" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">REMOTE</text><text x="2040" y="1787" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">Non-visit: teknisi memperbaiki isian</text><rect x="960" y="1675" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M978,1675 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="960" y="1745" width="10" height="74" rx="5" fill="#4a6fb5"/><text x="1300" y="1706" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">IN PROGRESS</text><text x="1300" y="1787" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">Visit: teknisi memperbaiki isian</text><rect x="220" y="1125" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="560" y="1173" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Ya: Approve -&gt; approved_at/by,</text><text x="560" y="1209" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">closed_at, resolution_seconds dihitung</text><rect x="220" y="1400" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M238,1400 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="220" y="1470" width="10" height="74" rx="5" fill="#2f7d4f"/><text x="560" y="1431" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">CLOSED</text><text x="560" y="1512" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">SLA Resolution berhenti; tiket final</text><rect x="90" y="1995" width="2420" height="188" rx="16" fill="#f6fafd" stroke="#9cbcd6" stroke-width="2"/><rect x="90" y="1995" width="10" height="188" rx="5" fill="#3b7ea1"/><text x="138" y="2037" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">canApproveClose(): status PROGRESS_DONE, role TROUBLE_TICKET_APPROVE, dan bukan teknisi tiket itu sendiri.</text><text x="138" y="2081" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">SLA Resolution TETAP berjalan selama menunggu approval dan setelah reject.</text><text x="138" y="2125" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">rejectClose(): wajib alasan; tiket kembali ke REMOTE (jalur non-visit) atau IN PROGRESS (jalur visit).</text></svg>