ominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">SLA Response sudah berhenti; SLA Resolution</text><text x="1300" y="429" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">belum berjalan</text><rect x="960" y="575" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="605" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Teknisi menangani gangguan dari jarak</text><text x="1300" y="641" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">jauh; chat &amp; lampiran tercatat di</text><text x="1300" y="677" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">timeline</text><polygon points="865,925 1300,815 1735,925 1300,1035" fill="#eaf4e4" stroke="#7fae63" stroke-width="3" filter="url(#sh)"/><text x="1300" y="925" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#0f2b46">Gangguan selesai remote?</text><rect x="220" y="1125" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="560" y="1173" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Ya: Form Close — RCA, Sub-RCA,</text><text x="560" y="1209" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">keterangan, evidence (wajib)</text><rect x="1700" y="1125" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="2040" y="1173" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Tidak: catat bukti upaya remote + alasan</text><text x="2040" y="1209" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">perlu visit</text><rect x="1700" y="1400" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="2040" y="1448" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Create Plan: isi tanggal plan visit (+</text><text x="2040" y="1484" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">target online)</text><rect x="1700" y="1675" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M1718,1675 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="1700" y="1745" width="10" height="74" rx="5" fill="#c08a2e"/><text x="2040" y="1706" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">PLAN</text><text x="2040" y="1770" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">visit_decision = VISIT; menunggu tanggal</text><text x="2040" y="1804" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">kunjungan</text><rect x="220" y="1400" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M238,1400 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="220" y="1470" width="10" height="74" rx="5" fill="#7a5aa6"/><text x="560" y="1431" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">PROGRESS DONE</text><text x="560" y="1512" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">approval = PENDING; menunggu supervisor</text><polygon points="125,1750 560,1640 995,1750 560,1860" fill="#eaf4e4" stroke="#7fae63" stroke-width="3" filter="url(#sh)"/><text x="560" y="1750" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#0f2b46">Supervisor menyetujui?</text><rect x="220" y="1950" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M238,1950 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="220" y="2020" width="10" height="74" rx="5" fill="#2f7d4f"/><text x="560" y="1981" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">CLOSED</text><text x="560" y="2062" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">Tiket final</text><rect x="960" y="1950" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="1998" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Reject: tiket kembali ke REMOTE untuk</text><text x="1300" y="2034" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">diperbaiki isiannya</text><rect x="90" y="2270" width="2420" height="276" rx="16" fill="#f6fafd" stroke="#9cbcd6" stroke-width="2"/><rect x="90" y="2270" width="10" height="276" rx="5" fill="#3b7ea1"/><text x="138" y="2312" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">startRemote(): hanya dari OPEN, oleh teknisi yang ditugaskan atau superadmin.</text><text x="138" y="2356" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">CATATAN: kode saat ini masih mengisi progress_started_at di startRemote() — belum sesuai diagram ini.</text><text x="138" y="2400" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">SLA Resolution tidak berjalan di tahap Remote: hitungannya baru mulai saat progres di site dimulai.</text><text x="138" y="2444" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Form close wajib evidence; RCA &amp; Sub-RCA diperbarui dari isian form close.</text><text x="138" y="2488" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Patokan SLA Resolution untuk tiket yang ditutup langsung dari Remote: PERLU KONFIRMASI.</text></svg>