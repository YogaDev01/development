<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2821" viewBox="0 0 2600 2821"><defs><marker id="ar" markerWidth="13" markerHeight="13" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#44708f"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f2b46" flood-opacity="0.13"/></filter></defs><rect width="2600" height="2821" fill="#ffffff"/><rect x="0" y="0" width="2600" height="190" fill="#f6fafd"/><rect x="0" y="188" width="2600" height="3" fill="#9cbcd6"/><rect x="90" y="56" width="10" height="70" rx="5" fill="#3b7ea1"/><text x="128" y="92" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1" fill="#0f2b46">1 · OPEN</text><text x="128" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#5b7b95">Pembuatan tiket &amp; respons pertama teknisi</text><polyline points="1300,438 1300,569" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="1300,713 1300,844" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="1300,988 1300,1119" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="1300,1291 1300,1394" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="1646,1205 2040,1205 2040,1394" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="859,1475 560,1475 560,1669" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="752" y="1421" width="94" height="40" rx="12" fill="#ffffff" stroke="#9cbcd6" stroke-width="1.5"/><text x="799" y="1442" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#5b7b95">Belum</text><polyline points="1300,1556 1300,1669" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="1274" y="1592" width="52" height="40" rx="12" fill="#ffffff" stroke="#9cbcd6" stroke-width="1.5"/><text x="1300" y="1614" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#5b7b95">Ya</text><polyline points="1300,1813 1300,1944" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><polyline points="1300,2088 1300,2219" fill="none" stroke="#44708f" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="960" y="300" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="348" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">CSO / NOC / Admin membuat tiket: site,</text><text x="1300" y="384" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">device, initial problem, deskripsi</text><rect x="960" y="575" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="623" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Validasi master: site aktif, teknisi PIC</text><text x="1300" y="659" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">internal aktif, RCA/Sub-RCA cocok</text><rect x="960" y="850" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="898" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">No. TT otomatis (generateNumber) atau</text><text x="1300" y="934" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">No. TT custom yang belum terpakai</text><rect x="960" y="1125" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M978,1125 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="960" y="1195" width="10" height="74" rx="5" fill="#3b7ea1"/><text x="1300" y="1156" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">OPEN</text><text x="1300" y="1220" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">Tiket tersimpan; assigned_at diisi; SLA</text><text x="1300" y="1254" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">Response mulai</text><rect x="1700" y="1400" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="2040" y="1466" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Notifikasi ke teknisi &amp; leader team</text><polygon points="865,1475 1300,1365 1735,1475 1300,1585" fill="#eaf4e4" stroke="#7fae63" stroke-width="3" filter="url(#sh)"/><text x="1300" y="1475" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#0f2b46">Teknisi membuka tiket?</text><rect x="220" y="1675" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="560" y="1723" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Belum: SLA Response terus berjalan</text><text x="560" y="1759" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">(risiko breach)</text><rect x="960" y="1675" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="1723" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Ya: acknowledged_at + response_seconds</text><text x="1300" y="1759" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">dicatat; SLA Response berhenti</text><rect x="960" y="1950" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="1998" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">mustDecide: chat &amp; aksi lain terkunci</text><text x="1300" y="2034" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">sampai teknisi memilih Remote</text><rect x="960" y="2225" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M978,2225 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="960" y="2295" width="10" height="74" rx="5" fill="#2f8f83"/><text x="1300" y="2256" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">REMOTE</text><text x="1300" y="2337" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">Teknisi menekan Mulai Remote</text><rect x="90" y="2545" width="2420" height="232" rx="16" fill="#f6fafd" stroke="#9cbcd6" stroke-width="2"/><rect x="90" y="2545" width="10" height="232" rx="5" fill="#3b7ea1"/><text x="138" y="2587" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">create(): site ACTIVE, teknisi wajib PIC internal aktif site itu dan bukan leader team.</text><text x="138" y="2631" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Kebijakan SLA dipilih per Problem (SlaPolicy::applicableForProblem); tanpa Problem dipakai kebijakan umum.</text><text x="138" y="2675" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">recordAccess(): hanya akses teknisi yang ditugaskan yang mencatat acknowledged_at — sekali seumur tiket.</text><text x="138" y="2719" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Dari OPEN teknisi hanya bisa memilih Remote; Create Plan baru tersedia setelah tahap Remote.</text></svg>