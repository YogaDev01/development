ht="600" letter-spacing="0" fill="#0f2b46">Gangguan selesai?</text><rect x="1700" y="1125" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="2040" y="1173" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Belum: pengerjaan lanjut, SLA Resolution</text><text x="2040" y="1209" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">terus berjalan</text><rect x="960" y="1125" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="1300" y="1155" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Ya: Form Close — RCA, Sub-RCA,</text><text x="1300" y="1191" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">keterangan penyelesaian, evidence</text><text x="1300" y="1227" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">(wajib)</text><rect x="960" y="1400" width="680" height="160" rx="18" fill="#ffffff" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><path d="M978,1400 h644 a18,18 0 0 1 18,18 v44 h-680 v-44 a18,18 0 0 1 18,-18 z" fill="#1f4868"/><rect x="960" y="1470" width="10" height="74" rx="5" fill="#7a5aa6"/><text x="1300" y="1431" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">PROGRESS DONE</text><text x="1300" y="1495" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">resolved_at &amp; progress_done_at diisi; approval</text><text x="1300" y="1529" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">= PENDING</text><rect x="220" y="1400" width="680" height="132" rx="18" fill="#eef5fc" stroke="#9cbcd6" stroke-width="2" filter="url(#sh)"/><text x="560" y="1448" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">Notifikasi ke supervisor: tiket menunggu</text><text x="560" y="1484" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#0f2b46">approval</text><rect x="90" y="1720" width="2420" height="188" rx="16" fill="#f6fafd" stroke="#9cbcd6" stroke-width="2"/><rect x="90" y="1720" width="10" height="188" rx="5" fill="#3b7ea1"/><text x="138" y="1762" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">startProgress(): hanya dari TRIP dan hanya setelah On Site dikonfirmasi.</text><text x="138" y="1806" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">progress_started_at tidak pernah ditimpa — SLA Resolution dihitung dari titik pertama kali progres dimulai.</text><text x="138" y="1850" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">close(): evidence wajib untuk semua tiket; RCA/Sub-RCA tiket diperbarui sesuai isian form close.</text></svg>