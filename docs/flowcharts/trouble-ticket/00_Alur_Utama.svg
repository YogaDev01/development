 0 0 1 18,-18 z" fill="#1f4868"/><rect x="960" y="3945" width="10" height="74" rx="5" fill="#2f7d4f"/><text x="1300" y="3906" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">CLOSED</text><text x="1300" y="3987" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#0f2b46">SLA Resolution berhenti; tiket final</text><rect x="90" y="4195" width="2420" height="276" rx="16" fill="#f6fafd" stroke="#9cbcd6" stroke-width="2"/><rect x="90" y="4195" width="10" height="276" rx="5" fill="#3b7ea1"/><text x="138" y="4237" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">SLA Resolution hanya berjalan dari tahap In Progress sampai Closed; Remote / Plan / Trip tidak dihitung.</text><text x="138" y="4281" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Form Close bisa dikirim dari tahap Remote, Plan, Trip, dan In Progress (TroubleTicket::CLOSABLE).</text><text x="138" y="4325" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Close dari Trip sebelum On Site: perjalanan yang sedang berjalan dibatalkan otomatis, SLA Travel tidak dihitung.</text><text x="138" y="4369" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Change Teknisi hanya pada tahap Plan / Trip selama perjalanan belum dimulai (canReassign).</text><text x="138" y="4413" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#0f2b46">Approval penutupan: role supervisor dan bukan teknisi tiket itu sendiri (canApproveClose).</text></svg>